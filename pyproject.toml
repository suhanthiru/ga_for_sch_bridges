[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sb"
version = "0.0.1"
description = "Schrodinger bridges in a robotics control stack: gated experiments and architecture search"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "cma",
    "tabulate",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["sb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than a minute; skipped by the gate preflight",
    "gpu: needs a CUDA device",
]
addopts = "-q"
